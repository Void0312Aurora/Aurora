# dsh-desktop packaging (electron-builder). The app payload is lib/ (the
# Electron main), build/ (icons), and deploy/ (the materialized dsh web
# closure from `pnpm run deploy:closure`). Workspace runtime imports are
# materialized under lib/, so this whitelist intentionally excludes node_modules.
appId: ai.deepseek.dsh-desktop
productName: DSH Desktop
directories:
  output: release
  buildResources: build
files:
  - lib/**
  - build/**
  - deploy/**
  - package.json
asar: true
# Electron-as-Node children (the embedded closure and the reaper) cannot read
# inside app.asar; keep them on the real unpacked tree.
asarUnpack:
  - deploy/**
  - lib/types/reaper.js
  - lib/process-tree/**
# The deploy closure's native addons are N-API (node-pty, koffi), which stay
# ABI-compatible with Electron-as-Node; no rebuild against Electron headers.
npmRebuild: false
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DSH Desktop
portable:
  artifactName: ${productName}-${version}-portable.${ext}
