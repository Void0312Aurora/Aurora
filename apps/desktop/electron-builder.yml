# dsh-desktop packaging (electron-builder). The app payload is lib/ (the
# Electron main), build/ (icons), and deploy/ (the materialized dsh web
# closure from `pnpm run deploy:closure`); this package's own node_modules
# carries only devDependencies, which electron-builder never packs.
appId: ai.deepseek.dsh-desktop
productName: DSH Desktop
directories:
  output: release
  buildResources: build
files:
  - lib/**
  - build/**
  - deploy/**
  - package.json
asar: true
# The deploy closure's native addons are N-API (node-pty, koffi), which stay
# ABI-compatible with Electron-as-Node; no rebuild against Electron headers.
npmRebuild: false
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DSH Desktop
portable:
  artifactName: ${productName}-${version}-portable.${ext}
